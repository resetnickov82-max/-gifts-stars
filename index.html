<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gifts Great</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10121b;
      color: white;
      text-align: center;
    }
    header {
      padding: 24px;
      background: #1b1e2d;
      font-size: 26px;
      font-weight: bold;
    }
    main {
      padding: 35px 20px;
    }
    h1 { color: #8b7cff; }
    p { color: #c7c9d6; line-height: 1.6; }
    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 12px;
      background: #7765ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .gift {
      margin: 24px auto;
      padding: 24px;
      max-width: 280px;
      border: 1px solid #393d55;
      border-radius: 18px;
      background: #1b1e2d;
    }
  </style>
</head>
<body>
  <header>Gifts Great</header>
  <main>
    <h1>Твої подарунки</h1>
    <p>Ласкаво просимо до Gifts Great!</p>
    <div class="gift">
      <h2>🎁 Telegram Gifts</h2>
      <p>Тут буде твоя колекція подарунків.</p>
      <button onclick="alert('Колекція скоро з’явиться!')">
        Переглянути
      </button>
    </div>
  </main>
</body>
  </html>
